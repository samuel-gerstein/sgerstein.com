- id: social-algorithms
  title: Local AI governance and the community dynamics of data centers
  # TODO (Samuel): decide how to word this affiliation (see note from Claude).
  org: Social Algorithms Group (Prof. Karrie Karahalios)
  dates: 2025 – present
  summary: Qualitative study of how U.S. localities regulate AI absent federal rules, and how data centers affect host communities.
  details:
    - Collected all 77 AI policies from 55 U.S. local governments through systematic searches and policy repositories.
    - Conducted the literature review, contributed to study design, and co-wrote the methodology.
  featured: false

- id: ibm-climate
  title: Representation fusion for climate foundation models
  org: IBM-Illinois Discovery Accelerator Institute
  dates: 2024 – 2025
  summary: Team project extending IBM/NASA's Prithvi climate foundation model with graph-based and multimodal representations for weather, crop-yield, and climate-risk forecasting.
  details:
    - Co-developed, with a teammate, crop-yield models built on GraphCast representations, reducing crop-indemnity payout estimation error by 15%.
    - Contributed to design discussions for a multimodal architecture fusing satellite imagery with weather-station data across spatial and temporal scales.
    - Contributed to design discussions for extending Prithvi with graph-based representations; the team's framework improved masked-region and autoregressive prediction.
    # TODO (Samuel): add where the poster was presented, if anywhere (e.g. a symposium name and year).
    - Co-created a research poster presenting the work.
  featured: true

- id: contextual-engineering
  title: Contextual utility design on the Navajo Nation
  org: Contextual Engineering Research Group, UIUC
  dates: 2023
  summary: Entropy-maximization models and a qualitative coding method to inform community-centered water and power infrastructure.
  details:
    - Modeled community characteristics via entropy maximization to inform water infrastructure design.
    - Developed a qualitative coding method for engineers with 0.70 inter-rater agreement (Fleiss' kappa).
    - REU fellowship in Bodaway Gap, Arizona, studying ethnography in the algorithm design process.
  award: Outstanding Research Poster Award
  featured: true
  links:
    poster: /posters/qualitative-coding-contextual-engineering.webp

