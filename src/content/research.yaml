- id: social-algorithms
  title: Local AI governance and the community dynamics of data centers
  # TODO (Samuel): decide how to word this affiliation (see note from Claude).
  org: Social Algorithms Group (Prof. Karrie Karahalios)
  dates: 2025 – present
  summary: Qualitative study of how U.S. localities regulate AI absent federal rules, and how data centers affect host communities.
  details:
    - Collected all 77 AI policies from 55 U.S. local governments through systematic searches and policy repositories.
    - Conducted the literature review, contributed to study design, and co-wrote the methodology.
  featured: false

- id: ibm-climate
  title: Representation fusion for climate foundation models
  org: IBM-Illinois Discovery Accelerator Institute
  dates: 2024 – 2025
  summary: Team project extending IBM/NASA's Prithvi climate foundation model with graph-based and multimodal representations for weather, crop, and climate-risk forecasting.
  details:
    - Co-developed, with Dhanish Natarajan, neural network models predicting crop indemnities across 3,144 U.S. counties; adding GraphCast representations reduced test MSE by 15% (R² 0.70 → 0.74).
    - Contributed to design discussions for a multimodal architecture fusing satellite imagery with weather-station data across spatial and temporal scales.
    - Contributed to design discussions for extending Prithvi with graph-based representations; the team's framework improved masked-region and autoregressive prediction.
    - Presented at the UIUC Undergraduate Research Symposium (2025).
    - "PIs: Dr. Jingrui He, Dr. Hanghang Tong, and Dr. Elizabeth Ainsworth. Supported by the Illinois Scholars Undergraduate Research (ISUR) program."
  award: IIDAI URE Fellow
  featured: true
  links:
    poster: /posters/neural-representations-climate-models.webp

- id: contextual-engineering
  title: Contextual engineering for community water systems
  org: Contextual Engineering Research Group, UIUC
  dates: 2023
  summary: Qualitative and computational methods to center community needs in the design of water and power infrastructure.
  details:
    - Co-developed, with Annabelle Epplin and Cathy Li, a qualitative coding process and master codebook for community interviews about a water system in Clarinero, Honduras, reaching moderate-to-substantial inter-rater agreement (Fleiss' κ = 0.56–0.69).
    - Modeled community characteristics via entropy maximization to inform water infrastructure design.
    - REU fellowship in Bodaway Gap, Arizona, on the Navajo Nation, studying ethnography in the algorithm design process.
    - Presented at the UIUC Undergraduate Research Symposium (2023).
  award: Outstanding Research Poster Award
  featured: true
  links:
    poster: /posters/qualitative-coding-contextual-engineering.webp

